name: Update corp codes

on:
  schedule:
    - cron: "0 18 * * 0"   # 매주 월요일 03:00 KST (UTC 일요일 18:00)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download latest corp codes
        run: npm run update-corp-codes
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}

      - name: Sanity check (50,000건 미만이면 중단)
        run: |
          node -e "const n=require('./data/corp-codes.json').length; console.log('entries:', n); if(n<50000){console.error('too few entries'); process.exit(1)}"

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/corp-codes.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corp-codes.json
          git commit -m "chore: weekly corp codes update"
          git push
